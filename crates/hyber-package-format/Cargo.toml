[package]
name = "hyber-package-format"
version = "0.1.0"
edition = "2021"
description = "Phase 17 deterministic signed Hyber package format"

[dependencies]
ed25519-dalek = { version = "2", default-features = false, features = ["std"] }
hyber-manifest = { path = "../hyber-manifest" }
serde = { version = "1", features = ["derive"] }
sha2 = "0.10"
toml = "0.8"
