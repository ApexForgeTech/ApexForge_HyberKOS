[workspace]
members = [
    "crates/hyber-core",
    "crates/hyber-object",
    "crates/hyber-namespace",
    "crates/hyber-handle",
    "crates/hyber-vfs",
    "crates/hyber-api",
    "crates/hyber-process",
    "crates/hyber-device",
    "crates/hyber-service",
    "crates/hyber-memfs",
    "backends/linux/hyber-hostfs",
    "applications/hyber-shell", "applications/hyber-cli", "crates/hyber-lua",
    "crates/hyber-fs",
    "applications/hyberfs-tool",
]
resolver = "2"
